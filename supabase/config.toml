# LifePass AI — Supabase Project CLI Configuration Foundation

project_id = "lifepass-ai-dev"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600

[auth.sms]
enable_signup = true
double_confirm_changes = true

[auth.sms.test_otp]
"+15550192834" = "123456"
"+15550192835" = "123456"
"+12345678901" = "123456"
"+14155552671" = "123456"

[auth.sms.twilio]
enabled = true
account_sid = "AC00000000000000000000000000000000"
message_service_sid = "MG00000000000000000000000000000000"
auth_token = "00000000000000000000000000000000"

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.profile]
enabled = true
verify_jwt = false
import_map = "./functions/profile/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/profile/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/profile/*.html" ]

